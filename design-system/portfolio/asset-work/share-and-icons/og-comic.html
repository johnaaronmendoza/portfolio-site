<!doctype html>
<!--
  Share image (Open Graph / Twitter), 1200x630, Paper & Ink + comic layer (Nov 2026).
  Concept: the site's own hero, shown: the welcome.exe window with the white/yellow pixel
  name, the hero lead under it, and Lil Johnny pointing at the name from a yellow burst.
  Words: only site copy (Hero.tsx NAME_LINES, ROLE_LINE, Lead). Fonts: local files.
  Render: node .claude/skills/asset-toolkit/scripts/html2png.mjs <this> --out renders --name og-comic
          --size 1200x630 --require-font "Press Start 2P" --require-font "IBM Plex Sans"
-->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:"Press Start 2P";src:url("../../../../client/public/fonts/PressStart2P.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:100 700;font-stretch:85% 100%;src:url("file:///home/claude/ext/gfonts/ofl/ibmplexsans/IBMPlexSans[wdth,wght].ttf")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;src:url("file:///home/claude/ext/gfonts/ofl/ibmplexmono/IBMPlexMono-SemiBold.ttf")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#EFEAE0;background-image:radial-gradient(rgb(0 0 0 / .09) 1.4px,transparent 1.6px);background-size:12px 12px;color:#111}
.window{position:absolute;left:60px;top:70px;width:700px;border:4px solid #000;background:#111;box-shadow:12px 12px 0 #000}
.bar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111;color:#fff;font:600 20px "IBM Plex Mono";border-bottom:4px solid #000}
.name{padding:38px 40px 44px;font:58px/1.3 "Press Start 2P"}
.role{position:absolute;left:60px;top:440px;font:600 26px "IBM Plex Mono";color:#2347D6}
.lead{position:absolute;left:60px;top:486px;width:720px;font:700 40px/1.2 "IBM Plex Sans";font-stretch:90%;text-wrap:balance}
.burst{position:absolute;left:800px;top:120px;width:360px;height:400px}
.johnny{position:absolute;left:880px;top:150px;height:340px;transform:scaleX(-1);image-rendering:pixelated}
</style></head><body>
<div class="window"><div class="bar"><span>welcome.exe</span><span>○□✕</span></div>
 <div class="name"><div style="color:#fff">JOHN AARON</div><div style="color:#FFD23F">BRANZUELA</div></div></div>
<div class="role">&gt; AI, data and full-stack developer</div>
<div class="lead">I build AI and data tools people can trust.</div>
<svg class="burst" viewBox="0 0 100 100" preserveAspectRatio="none" style="transform:rotate(-8deg)"><polygon id="p" fill="#FFD23F" stroke="#000" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
<img class="johnny" src="../../../../client/public/assets/mascot/poses/point-right.png" alt="">
<script>
const pts=[...Array(24)].map((_,i)=>{const r=i%2?33:48,a=i*Math.PI/12;return (50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)}).join(' ');
document.getElementById('p').setAttribute('points',pts);
</script>
</body></html>
